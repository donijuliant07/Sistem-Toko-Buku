# Blueprint Render untuk scraper-service (Web Service Docker).
#
# Hanya service ini yang dideploy lewat Render; backend & frontend tetap di
# tempatnya masing-masing. Deploy: Render Dashboard -> New -> Blueprint ->
# pilih repo ini.
#
# PENTING — Blueprint Render selalu membaca `render.yaml` dari ROOT branch,
# bukan dari subfolder. Dengan file ini di `scraper-service/`, tombol Blueprint
# di dashboard tidak akan menemukannya. Dua cara deploy yang benar:
#   a) Manual (tanpa Blueprint): New -> Web Service -> pilih repo -> Root Directory
#      = `scraper-service`, Runtime = Docker. Isi env var secara manual.
#   b) Blueprint: salin file ini ke root repo (path relatifnya kembali ke
#      `./Dockerfile` dan `scraper-service`), baru Blueprint bisa dipakai.
# File di sini tetap berguna sebagai dokumentasi konfigurasi + bisa dipakai
# ulang lewat Render CLI: `render blueprint launch -f scraper-service/render.yaml`.
#
# Catatan sumber daya (lihat README.md):
# - Chromium + MAX_CONCURRENT_SCRAPES=2 butuh >= 1 GB RAM. `starter` (512 MB)
#   kemungkinan OOM; minimal `standard` (2 GB).
# - Plan `free` tidur setelah 15 menit idle. Cold start Chromium +/- 50 detik,
#   sementara backend memakai SCRAPER_TIMEOUT_SECONDS=20 -> request pertama
#   gagal. Jangan pakai plan `free` untuk melayani backend.
#
# `sync: false` = nilai diisi manual di dashboard Render (jangan di-commit).

services:
  - type: web
    name: scraper-service
    runtime: docker
    plan: standard
    region: singapore
    # Path relatif terhadap folder file ini. Bila disalin ke root repo,
    # ganti menjadi `./scraper-service/Dockerfile` dan `./scraper-service`.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Harus sama dengan SCRAPER_API_TOKEN di backend/.env.
      # Kosong = endpoint /scrape tidak memeriksa token -> wajib diisi.
      - key: SCRAPER_API_TOKEN
        sync: false
      # Hanya dipakai mode cron (python -m src.main), tidak dipakai server API.
      - key: DATABASE_URL
        sync: false
      - key: MAX_CONCURRENT_SCRAPES
        value: "2"
      - key: HEADLESS
        value: "true"
      - key: BROWSER_CHANNEL
        value: chromium
      # PORT TIDAK di-set: Render menyuntikkan sendiri dan src/config.py membacanya.
