[project]
name = "backend"
version = "0.1.0"
description = "Bookstore API backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "multipart>=1.3.0",
    "pyjwt[crypto]>=2.10.1",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
    "alembic>=1.20.0",
    "supabase>=2.32.0",
    "slowapi>=0.1.10",
    "email-validator>=2.3.0",
]

[project.scripts]
"main.py" = "main:run"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# FastAPI memakai `Depends(...)`/`Query(...)` sebagai default dependency; itu
# pola resmi framework sehingga B008 tidak relevan di layer API.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Boundary layer: kegagalan klien Supabase/HTTP apa pun diteruskan sebagai 4xx.
"app/api/v1/*.py" = ["BLE001"]
"app/core/security.py" = ["BLE001"]
# Klien AI eksternal: balasan bebas dari model tidak bisa diandalkan bentuknya,
# jadi kegagalan apa pun diperlakukan sebagai "validasi AI tidak tersedia".
"app/services/ai_review_service.py" = ["BLE001"]
"app/services/marketplace/ai_price_validator.py" = ["BLE001"]
